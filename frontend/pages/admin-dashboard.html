<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | FaceAttend AI</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel">
            <div class="sidebar-header">
                <h3><span class="text-gradient">FaceAttend</span></h3>
            </div>
            <nav class="sidebar-nav">
                <a href="/pages/admin-dashboard.html" class="nav-item active">Dashboard</a>
                <a href="/pages/employees.html" class="nav-item">Employees</a>
                <a href="/pages/attendance.html" class="nav-item">Attendance</a>
                <a href="#" class="nav-item" onclick="Auth.logout()">Logout</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h2>Dashboard Overview</h2>
                <button class="btn btn-primary" onclick="exportAttendanceCSV()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:0.5rem;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Export Today's Report
                </button>
            </header>
            
            <div class="stats-grid" style="grid-template-columns: repeat(4, 1fr); margin-bottom: 2rem;">
                <div class="glass-panel stat-card">
                    <h4 class="text-secondary">Total Employees</h4>
                    <h2 class="stat-value" id="stat-employees">0</h2>
                </div>
                <div class="glass-panel stat-card">
                    <h4 class="text-secondary">Present Today</h4>
                    <h2 class="stat-value text-success" id="stat-present">0</h2>
                </div>
                <div class="glass-panel stat-card">
                    <h4 class="text-secondary">Late Arrivals</h4>
                    <h2 class="stat-value text-warning" id="stat-late">0</h2>
                </div>
                <div class="glass-panel stat-card">
                    <h4 class="text-secondary">Absent</h4>
                    <h2 class="stat-value text-danger" id="stat-absent">0</h2>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem;">
                <!-- Chart Section -->
                <div class="glass-panel">
                    <h3 class="mb-4">Attendance Trends (Last 7 Days)</h3>
                    <canvas id="attendanceChart" height="100"></canvas>
                </div>

                <!-- Recent Activity Table -->
                <div class="glass-panel">
                    <h3 class="mb-4">Live Check-ins</h3>
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Date/Time</th>
                                <th>Status</th>
                                <th>Confidence</th>
                            </tr>
                        </thead>
                        <tbody id="recent-activity-body">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
            </div>
        </main>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
