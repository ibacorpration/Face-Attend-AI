<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees | FaceAttend AI</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel">
            <div class="sidebar-header">
                <h3><span class="text-gradient">FaceAttend</span></h3>
            </div>
            <nav class="sidebar-nav">
                <a href="/pages/admin-dashboard.html" class="nav-item">Dashboard</a>
                <a href="/pages/employees.html" class="nav-item active">Employees</a>
                <a href="/pages/attendance.html" class="nav-item">Attendance</a>
                <a href="#" class="nav-item" onclick="Auth.logout()">Logout</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h2>Manage Employees</h2>
                <button class="btn btn-primary" onclick="openAddModal()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Add Employee
                </button>
            </header>

            <div class="glass-panel">
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Code</th>
                                <th>Name</th>
                                <th>Department</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="employees-body">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Employee Modal -->
    <div class="modal-overlay" id="add-modal">
        <div class="glass-panel modal-content">
            <div class="modal-header">
                <h3>Add New Employee</h3>
                <button class="close-btn" onclick="closeAddModal()">&times;</button>
            </div>
            <form id="add-employee-form">
                <div class="form-group">
                    <label class="form-label">Employee Code</label>
                    <input type="text" id="emp-code" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="emp-name" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Department</label>
                    <input type="text" id="emp-dept" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Face Image (Required for Recognition)</label>
                    <input type="file" id="emp-face" class="form-input" accept="image/*" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Save Employee & Register Face</button>
            </form>
        </div>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/employee.js"></script>
</body>
</html>
