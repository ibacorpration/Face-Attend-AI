<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Log | FaceAttend AI</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel">
            <div class="sidebar-header">
                <h3><span class="text-gradient">FaceAttend</span></h3>
            </div>
            <nav class="sidebar-nav">
                <a href="/pages/admin-dashboard.html" class="nav-item">Dashboard</a>
                <a href="/pages/employees.html" class="nav-item">Employees</a>
                <a href="/pages/attendance.html" class="nav-item active">Attendance</a>
                <a href="#" class="nav-item" onclick="Auth.logout()">Logout</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h2>Attendance Logs</h2>
                <div class="form-group" style="margin: 0; width: 200px;">
                    <input type="date" id="date-picker" class="form-input">
                </div>
            </header>

            <div class="glass-panel">
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Employee</th>
                                <th>Date</th>
                                <th>Check In</th>
                                <th>Check Out</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="attendance-body">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/attendance.js"></script>
</body>
</html>
